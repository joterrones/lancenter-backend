# App real creada por Fly Launch: lancenter-backend
# Deploy: cd backend && fly deploy
# Secrets: fly secrets set DATABASE_URL=... JWT_SECRET=... ADMIN_PASSWORD=...

app = "lancenter-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  JWT_EXPIRES_IN = "7d"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
