# Lancenter API — https://lancenter-backend.fly.dev
# Región gru (mejor RTT desde Perú/LatAm). RDS us-east-1 añade ~100ms/query.
app = "lancenter-backend"
primary_region = "gru"

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  JWT_EXPIRES_IN = '7d'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # POS: nunca apagar (cold start = varios segundos de espera).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  memory_mb = 2048
